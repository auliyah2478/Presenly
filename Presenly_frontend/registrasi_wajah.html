
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registrasi Wajah | Presenly</title>

    <link
        rel="stylesheet"
        href="styles/style.css?v=20261108-5"
    >

</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card face-card">

            <div class="login-brand">
                <div class="login-logo">P</div>
                <span>presenly<span class="brand-dot">.</span></span>
            </div>

            <div class="login-heading">
                <span class="login-eyebrow">
                    FACE REGISTRATION
                </span>

                <h1>Registrasi Wajah</h1>

                <p>
                    Arahkan wajah ke kamera untuk
                    mendaftarkan identitas biometrik.
                </p>
            </div>

            <div class="face-info">
                <p id="infoMahasiswa">
                    Menyiapkan informasi mahasiswa...
                </p>
            </div>

            <div class="camera-container">

                <div class="camera-label">
                    <span class="camera-indicator"></span>
                    Kamera Presenly
                </div>

                <video
                    id="video"
                    autoplay
                    playsinline
                    muted
                    class="face-video"
                ></video>

            </div>

            <canvas
                id="canvas"
                style="display: none;"
            ></canvas>

            <div class="login-form face-form">

                <button
                    type="button"
                    id="registrasiButton"
                    disabled
                >
                    Daftarkan Wajah
                    <span aria-hidden="true">→</span>
                </button>

                <p id="message" aria-live="polite"></p>

            </div>

            <div class="login-footer">
                Presenly · Smart Attendance System
            </div>

        </section>

    </main>

    <script src="scripts/registrasi_wajah.js?v=4"></script>

</body>
</html>
