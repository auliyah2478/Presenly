<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Registrasi Wajah - Presenly
    </title>

    <link
        rel="stylesheet"
        href="styles/style.css"
    >

</head>


<body>

<div class="login-container">

    <div class="login-card">

        <h1>
            Registrasi Wajah
        </h1>

        <p id="infoMahasiswa">
            Menyiapkan kamera...
        </p>


        <video
            id="video"
            autoplay
            playsinline
            muted
            style="
                width: 100%;
                border-radius: 10px;
                margin-top: 15px;
            "
        >
        </video>


        <canvas
            id="canvas"
            style="display: none;"
        >
        </canvas>


        <button
            type="button"
            id="registrasiButton"
            style="margin-top: 15px;"
            disabled
        >
            Daftarkan Wajah
        </button>


        <p id="message"></p>

    </div>

</div>


<script src="scripts/registrasi_wajah.js?v=3"></script>
</body>
</html>
