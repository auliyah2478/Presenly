<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Input Mahasiswa - Presenly</title>

    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Input Mahasiswa</h1>
        <p>Tambahkan data mahasiswa baru</p>

        <input
            type="text"
            id="npm"
            placeholder="NPM"
        >

        <input
            type="text"
            id="nama"
            placeholder="Nama Mahasiswa"
        >

        <input
            type="email"
            id="email"
            placeholder="Email (opsional)"
        >

        <select id="kelas">
            <option value="">
                Pilih Kelas
            </option>
        </select>

        <button id="simpanButton">
            Simpan Mahasiswa
        </button>

        <p id="message"></p>

    </div>

</div>

<script src="scripts/input_mahasiswa.js"></script>

</body>
</html>
