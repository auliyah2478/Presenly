
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scan Absensi | Presenly</title>

    <link rel="stylesheet" href="styles/style.css?v=20261108-7">
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card scan-card">

            <div class="login-brand">
                <div class="login-logo">P</div>
                <span>presenly<span class="brand-dot">.</span></span>
            </div>

            <div class="login-heading">
                <span class="login-eyebrow">
                    SMART FACE ATTENDANCE
                </span>

                <h1>Scan Absensi</h1>

                <p>
                    Arahkan wajah ke kamera untuk
                    melakukan absensi perkuliahan.
                </p>
            </div>

            <div class="camera-container">

                <div class="camera-label">
                    <span class="camera-indicator"></span>
                    Kamera Presenly
                </div>

                <video
                    id="video"
                    autoplay
                    playsinline
                    class="scan-video"
                ></video>

            </div>

            <canvas
                id="canvas"
                style="display: none;"
            ></canvas>

            <div class="scan-form">

                <button type="button" id="scanButton">
                    Scan Wajah
                    <span aria-hidden="true">→</span>
                </button>

                <p
                    id="message"
                    class="scan-message"
                    role="status"
                    aria-live="polite"
                ></p>

            </div>

            <div id="hasil"></div>

            <div class="login-footer">
                Presenly · Smart Attendance System
            </div>

        </section>

    </main>

    <script src="scripts/scan_absensi.js?v=20261108-1"></script>

</body>
</html>
